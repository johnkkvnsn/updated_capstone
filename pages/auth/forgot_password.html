<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Barangay Financial Management Streamlining System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../assets/css/auth/forgot_password.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="login-page-body">
    <main class="login-diagonal-bg min-vh-100 d-flex align-items-center justify-content-center p-3">

        <section class="container">
            <div class="row justify-content-center">
                <article class="col-12 col-xl-10">

                    <div class="card login-main-card border-0 shadow-lg overflow-hidden">
                        <div class="row g-0 h-100 align-items-stretch">

                            <div class="col-lg-6 d-flex flex-column justify-content-center p-4 p-md-5 login-form-area">

                                <header class="d-flex align-items-center mb-4">
                                    <figure
                                        class="brand-icon-box bg-primary text-white rounded d-flex align-items-center justify-content-center me-2 mb-0">
                                        <i class="bi bi-bank"></i>
                                    </figure>
                                    <h4 class="mb-0 fw-bold text-dark-custom">BFMSS</h4>
                                </header>

                                <h3 class="fw-bold text-dark-custom mb-1">Reset Password</h3>
                                <p class="text-muted-custom small mb-4">Enter the email address associated with your
                                    account and we'll send you a link to reset your password.</p>

                                <form id="forgotPasswordForm">

                                    <fieldset class="mb-3 border-0 p-0">
                                        <input type="email" class="form-control form-input p-3" id="resetEmail"
                                            placeholder="Email Address" required>
                                    </fieldset>

                                    <button type="submit"
                                        class="btn btn-submit w-100 py-3 rounded-3 fw-semibold mb-4 text-white custom-btn-effect">
                                        Send Reset Link
                                    </button>

                                    <footer class="text-center mt-2">
                                        <a href="login.html"
                                            class="text-muted-custom text-decoration-none small fw-semibold custom-hover-text">
                                            <i class="bi bi-arrow-left me-1"></i> Back to Login
                                        </a>
                                    </footer>
                                </form>
                            </div>

                            <figure class="col-lg-6 d-none d-lg-block p-0 m-0 position-relative">
                                <img src="https://images.unsplash.com/photo-1577962917302-cd874c4e31d2?q=80&w=1000&auto=format&fit=crop"
                                    alt="Barangay Hall Concept" class="w-100 h-100 object-fit-cover login-side-image">
                                <div class="image-dark-overlay"></div>
                            </figure>

                        </div>
                    </div>

                </article>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/auth/forgot_password.js"></script>
</body>

</html>
